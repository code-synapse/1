<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字読み上げアプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>文字読み上げアプリ</h1>
      <p>入力したテキストをブラウザの音声合成機能で読み上げます。</p>

      <label for="text-input">読み上げる文字</label>
      <textarea id="text-input" rows="6" placeholder="ここに文字を入力してください"></textarea>

      <div class="controls">
        <label for="voice-select">音声</label>
        <select id="voice-select"></select>

        <label for="rate-range">速度: <span id="rate-value">1.0</span></label>
        <input id="rate-range" type="range" min="0.5" max="2" step="0.1" value="1" />

        <label for="pitch-range">高さ: <span id="pitch-value">1.0</span></label>
        <input id="pitch-range" type="range" min="0" max="2" step="0.1" value="1" />
      </div>

      <div class="buttons">
        <button id="speak-btn" type="button">▶ 読み上げる</button>
        <button id="stop-btn" type="button">■ 停止</button>
      </div>

      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
